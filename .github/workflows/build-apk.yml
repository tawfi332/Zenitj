name: Build Android APK

# Builds an installable release APK and publishes it to GitHub Releases, so you
# can open the release page on your phone and tap the .apk to install it.
#
# Signing: `expo prebuild` generates android/app/build.gradle with the release
# buildType wired to signingConfigs.debug (the bundled android/app/debug.keystore).
# So the APK is signed and installable, with the SAME signature every build --
# updates install straight over the previous one. That key is the well-known
# Android debug key, which is fine for sideloading onto your own device but is
# NOT acceptable for the Play Store; that would need a real keystore.
#
# Optional repository secrets (Settings -> Secrets and variables -> Actions).
# Without them the app still builds, but starts unconfigured: login fails and
# src/lib/supabase.ts logs "Supabase is not configured".
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required to create releases and upload the APK to them.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # .npmrc sets legacy-peer-deps, which SDK 57's peer graph needs.
      - name: Install dependencies
        run: npm install

      - name: Prebuild (generate native Android project)
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          src=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$src" ]; then
            echo "::error::Expected a signed APK at $src"
            echo "Contents of the release output dir:"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$src" out/zenitj.apk
          echo "APK_SIZE=$(du -h out/zenitj.apk | cut -f1)" >> "$GITHUB_ENV"

      - name: Verify the APK is actually signed
        run: |
          # An unsigned APK installs nowhere, so fail loudly here rather than
          # publishing a release that nobody can install.
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$apksigner" verify --print-certs out/zenitj.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenitj-apk
          path: out/zenitj.apk
          if-no-files-found: error

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Zenitj build ${{ github.run_number }}
          body: |
            Installable Android APK — ${{ env.APK_SIZE }}

            **On your phone:** tap `zenitj.apk` below. The first time, Android
            will ask you to allow "Install unknown apps" for your browser.

            Commit `${{ github.sha }}`
          files: out/zenitj.apk
          draft: false
          prerelease: true
