name: Build Android APK

# Builds an installable (unsigned release) APK and uploads it as a workflow
# artifact you can download from the run's "Artifacts" section.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY

on:
  push:
    branches:
      - claude/github-repo-context-mj84ug
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild (generate native Android project)
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/zenitj.apk || \
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/zenitj.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenitj-apk
          path: out/zenitj.apk
          if-no-files-found: error
